spring.application.name=inventory-service
server.port=8082

# PostgreSQL
spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5434/orderflow_inventory}
spring.datasource.username=${INVENTORY_DB_USERNAME:orderflow}
spring.datasource.password=${INVENTORY_DB_PASSWORD:orderflow}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
