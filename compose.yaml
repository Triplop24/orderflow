services:
  order-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: orderflow_orders
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow

    ports:
      - "5433:5432"

    volumes:
      - order_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orderflow -d orderflow_orders
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: orderflow_inventory
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow

    ports:
      - "5434:5432"

    volumes:
      - inventory_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orderflow -d orderflow_inventory
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order_db_data:
  inventory_db_data:
