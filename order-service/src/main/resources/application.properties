spring.application.name=order-service
server.port=8081

# PostgreSQL
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5433/orderflow_orders}
spring.datasource.username=${ORDER_DB_USERNAME:orderflow}
spring.datasource.password=${ORDER_DB_PASSWORD:orderflow}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
